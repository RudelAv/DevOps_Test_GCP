
name: Deploy PHP Application to Cloud Run

on:
    push:
        branches:
          - main

    workflow_dispatch:

env:
    PROJECT_ID: the-program-470313-k9
    REGION: us-central1
    REPOSITORY: php-app-repo
    SERVICE: php-devops-service
    IMAGE: php-app

jobs:
    deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            # checkout source code
            - name: Checkout repository
              uses: actions/checkout@v4

            # validate PHP syntax
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.3'

            - name: Validate PHP files
              run: |
                find app/php -type f -name "*.php" -print0 |
                xargs -0 -r -n1 php -l

            # authenticate with Google Cloud using WIF
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            # setup Google Cloud SDK
            - name: Setup Google Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            # configure Docker authentication
            - name: Configure Docker
              run: |
                gcloud auth configure-docker \
                ${{ env.REGION }}-docker.pkg.dev --quiet

            # build Docker image
            - name: Build Docker image
              run: |
                docker build \
                -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
                ./app/php

            # push image to Artifact Registry
            - name: Push Docker image
              run: |
                docker push \
                ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}

            # deploy to Cloud Run
            - name: Deploy to Cloud Run
              run: |
                gcloud run deploy ${{ env.SERVICE }} \
                --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
                --region=${{ env.REGION }} \
                --project=${{ env.PROJECT_ID }} \
                --quiet
